name: Publish WHY2 Docker Image

on:
  push:
    branches: [ development, stable, release ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version (release)
        if: github.ref_name == 'release'
        id: version
        run: |
          VERSION=$(grep '^version =' chat/Cargo.toml | head -n1 | sed -E 's/version\s*=\s*"(.*)"/\1/')
          echo "value=$VERSION" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/why2
          tags: |
            type=raw,value=${{ github.ref_name }},enable=${{ github.ref_name != 'release' }}
            type=raw,value=${{ steps.version.outputs.value }},enable=${{ github.ref_name == 'release' }}
            type=raw,value=latest,enable=${{ github.ref_name == 'stable' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: chat/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
