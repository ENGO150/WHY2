name: Build WHY2-chat

on:
  push:
    branches: [ development ]
  workflow_dispatch:
  schedule:
    - cron: '40 22 12 4 2'

jobs:
  test-why2:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os:  [ ubuntu-latest ]
        include:
          - os: ubuntu-latest
            client: ./out/why2-chat-client
            server: ./out/why2-chat-server
            configure: ./configure.sh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
        with:
          ref: development

      - if: matrix.os == 'ubuntu-latest'
        name: Update packages
        run: |
          sudo apt-get update
#         sudo apt-get upgrade

      - name: Permissions
        run: chmod +x ${{ matrix.configure }}

      - name: Preparation
        run: sudo ./${{ matrix.configure }}

      - name: Set up Rust # Normally works with configure.sh, but gitea has some beef with cargo idk
        uses: dtolnay/rust-toolchain@stable

      - name: Install WHY2
        run: make install

      - name: Build Chat
        run: make build_chat

      - if: env.bramborak == 'ted jsem tam mel jednu slapku' # Ensure this runs only on GitHub
        name: Upload Client
        uses: actions/upload-artifact@v4
        with:
          name: WHY2 Chat Client
          path: ${{ matrix.client }}

      - if: env.bramborak == 'ted jsem tam mel jednu slapku' # Ensure this runs only on GitHub
        name: Upload Server
        uses: actions/upload-artifact@v4
        with:
          name: WHY2 Chat Server
          path: ${{ matrix.server }}