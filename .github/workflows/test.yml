name: Test WHY2

on:
  push:
    branches: [ development ]
  workflow_dispatch:
  schedule:
    - cron: '40 22 12 4 2'

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  test-why2-encryption:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: development

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Test
        run: cargo test -p why2 encrypt_decrypt --verbose --release -- --nocapture

  test-why2-grid-overflow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: development

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Test
        run: cargo test -p why2 verify_multi_grid_overflow --verbose --release -- --nocapture

  test-why2-diffusion:
