        run: cargo test -p why2 test_auth_tamper_resistance --verbose --release -- --nocapture

  test-why2-entropy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: development

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Entropy Test
        run: cargo test -p why2 test_ciphertext_entropy --verbose --release -- --nocapture

  test-why2-stream:
