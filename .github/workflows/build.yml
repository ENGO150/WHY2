name: Build WHY2

on:
  push:
    branches: [ development, stable, release ]

permissions:
  contents: read
  actions: read

jobs:
  build-why2-examples:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Examples
        run: cargo build --examples --release -p why2 --verbose

  build-why2-chat:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libopus-dev libpipewire-0.3-dev libegl-dev clang libclang-dev libgbm-dev nasm

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew update && brew install opus pkg-config

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install nasm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Client
        run: cargo build --release

      - name: Build Server
        run: cargo build --bin why2-server --no-default-features --features server,windows_resources --release

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: why2-chat-${{ matrix.os }}
          path: |
            ./target/release/why2${{ runner.os == 'Windows' && '.exe' || '' }}
            ./target/release/why2-server${{ runner.os == 'Windows' && '.exe' || '' }}

  publish:
    needs: build-why2-chat
    runs-on: ubuntu-latest
    # Skips silently in a fork, or before the endpoint is configured.
    if: vars.DL_ENDPOINT != ''

    permissions:
      contents: read
      id-token: write        # lets the run mint its own OIDC token

    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish
        env:
          ENDPOINT: ${{ vars.DL_ENDPOINT }}
          AUDIENCE: why2-dl
        run: |
          set -euo pipefail

          # ACTIONS_ID_TOKEN_REQUEST_{URL,TOKEN} are injected by `id-token: write`.
          # A fresh token per file: the endpoint accepts each `jti` exactly once.
          mint() {
            curl -sS \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}" | jq -r .value
          }

          # Retried by hand rather than with --retry: the endpoint spends a
          # token's `jti` the first time it sees it, so curl's own retry would
          # resend a spent one and report the resulting 401 instead of the real
          # error. Each attempt mints its own.
          publish() {
            local file="$1" variant="$2" sum token attempt=1
            sum="$(sha256sum "$file" | cut -d' ' -f1)"

            while true; do
              token="$(mint)"
              echo "::add-mask::$token"

              # --fail-with-body, not -f: the endpoint's rejection reason is in
              # the body, and -f discards it.
              if curl -sS --fail-with-body \
                   -X PUT "$ENDPOINT/$variant" \
                   -H "Authorization: Bearer $token" \
                   -H "X-Content-SHA256: $sum" \
                   --data-binary "@$file"; then
                echo "published $variant ($sum)"
                return 0
              fi

              if [ "$attempt" -ge 3 ]; then
                echo "giving up on $variant after $attempt attempts" >&2
                return 1
              fi

              attempt=$((attempt + 1))
              sleep 5
            done
          }

          publish dist/why2-chat-ubuntu-latest/why2              client-linux
          publish dist/why2-chat-ubuntu-latest/why2-server       server-linux
          publish dist/why2-chat-macos-latest/why2               client-macos
          publish dist/why2-chat-macos-latest/why2-server        server-macos
          publish dist/why2-chat-windows-latest/why2.exe         client-windows.exe
          publish dist/why2-chat-windows-latest/why2-server.exe  server-windows.exe
