name: Build WHY2

on:
  push:
    branches: [ development, stable, release ]

permissions:
  contents: read
  actions: read

jobs:
  build-why2-examples:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Examples
        run: cargo build --examples --release -p why2 --verbose

  build-why2-chat:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libopus-dev libpipewire-0.3-dev libegl-dev clang libclang-dev libgbm-dev nasm

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew update && brew install opus pkg-config

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install nasm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Client
        run: cargo build --release

      - name: Build Server
        run: cargo build --bin why2-server --no-default-features --features server,windows_resources --release

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: why2-chat-${{ matrix.os }}
          path: |
            ./target/release/why2${{ runner.os == 'Windows' && '.exe' || '' }}
            ./target/release/why2-server${{ runner.os == 'Windows' && '.exe' || '' }}

  publish:
    needs: build-why2-chat
    runs-on: ubuntu-latest
    # Skips silently in a fork, or before the endpoint is configured.
    if: vars.DL_ENDPOINT != ''

    permissions:
      contents: read
      id-token: write        # lets the run mint its own OIDC token

    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish
        env:
          ENDPOINT: ${{ vars.DL_ENDPOINT }}
          AUDIENCE: why2-dl
        run: |
          set -euo pipefail

          # ACTIONS_ID_TOKEN_REQUEST_{URL,TOKEN} ARE INJECTED BY `id-token: write`.
          # A FRESH TOKEN PER REQUEST: THE ENDPOINT ACCEPTS EACH `jti` EXACTLY ONCE.
          #
          # THE ANSWER IS PARSED SEPARATELY RATHER THAN PIPED STRAIGHT INTO jq: UNDER
          # `pipefail` A NON-JSON ANSWER MAKES jq EXIT NON-ZERO, WHICH KILLED THE
          # WHOLE STEP FROM INSIDE THE RETRY LOOP THAT WAS MEANT TO SURVIVE IT
          mint() {
            local answer token

            answer="$(curl -sS --fail-with-body \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}")" || return 1

            token="$(printf '%s' "$answer" | jq -r '.value // empty' 2>/dev/null)" || return 1
            [ -n "$token" ] || return 1

            printf '%s' "$token"
          }

          # EVERY CHUNK AND COMPLETION RETRY NEEDS A FRESH SINGLE-USE TOKEN.
          upload_request() {
            local file="$1" url="$2" sum="$3" size="$4" chunk_sum="$5"
            local token attempt status response
            response="$(mktemp)"
            for attempt in 1 2 3 4; do
              status=""
              if token="$(mint)"; then
                echo "::add-mask::$token"
                if status="$(curl -sS --fail-with-body --output "$response" \
                     --write-out '%{http_code}' \
                     -X PUT "$url" \
                     -H "Authorization: Bearer $token" \
                     -H "X-Content-SHA256: $sum" \
                     -H "X-Upload-Size: $size" \
                     -H "X-Chunk-SHA256: $chunk_sum" \
                     --data-binary "@$file")"; then
                  rm -f "$response"
                  return 0
                fi
                cat "$response" >&2
              else
                echo "could not mint an upload token" >&2
              fi
              # A SIZE LIMIT IS PERMANENT; RETRYING THE SAME BODY CANNOT FIX IT.
              if [ "$status" = 413 ] || [ "$attempt" -eq 4 ]; then
                echo "upload failed: $url (HTTP ${status:-unknown})" >&2
                rm -f "$response"
                return 1
              fi
              sleep $((attempt * 15))
            done
          }

          publish() {
            local file="$1" variant="$2" sum size chunks chunk chunk_sum index=0
            sum="$(sha256sum "$file" | cut -d' ' -f1)"
            size="$(stat -c '%s' "$file")"
            chunks="$(mktemp -d)"
            # 64 MiB PER REQUEST, INCLUDING THE LAST PART, LEAVES HEADROOM BELOW
            # CLOUDFLARE'S 100 MB LIMIT. HTTP TRANSFER CHUNKING ALONE WOULD NOT.
            if ! split -b 67108864 -d -a 6 -- "$file" "$chunks/part-"; then
              rm -rf "$chunks"
              return 1
            fi
            for chunk in "$chunks"/part-*; do
              chunk_sum="$(sha256sum "$chunk" | cut -d' ' -f1)"
              echo "uploading $variant chunk $index ($size bytes total)"
              if ! upload_request "$chunk" "${ENDPOINT%/}/$variant/chunks/$index" "$sum" "$size" "$chunk_sum"; then
                rm -rf "$chunks"
                return 1
              fi
              index=$((index + 1))
            done
            rm -rf "$chunks"
            if ! upload_request /dev/null "${ENDPOINT%/}/$variant/complete" "$sum" "$size" ""; then
              return 1
            fi
            echo "published $variant <- ${file##*/} ($sum)"
          }

          publish dist/why2-chat-ubuntu-latest/why2              client-linux
          publish dist/why2-chat-ubuntu-latest/why2-server       server-linux
          publish dist/why2-chat-macos-latest/why2               client-macos
          publish dist/why2-chat-macos-latest/why2-server        server-macos
          publish dist/why2-chat-windows-latest/why2.exe         client-windows.exe
          publish dist/why2-chat-windows-latest/why2-server.exe  server-windows.exe
