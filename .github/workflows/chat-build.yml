name: Build WHY2 Chat

on:
  push:
    branches: [ development ]

jobs:
  build-why2:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: development

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Client
        run: cargo build --features client --release

      - name: Build Server
        run: cargo build --features server --release

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: why2-chat-${{ matrix.os }}
          path: |
            ./target/release/why2${{ runner.os == 'Windows' && '.exe' || '' }}
            ./target/release/why2-server${{ runner.os == 'Windows' && '.exe' || '' }}
