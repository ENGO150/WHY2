[workspace]
resolver = "2"
members = [
    "core", # CORE LIBRARY (REX)
    "chat", # CHAT IMPLEMENTATION
]

[workspace.package]
authors = ["Václav Šmejkal <engo@satan.red>"]
edition = "2024"
license = "GPL-3.0-only"
homepage = "https://why2.satan.red"
repository = "https://git.satan.red/ENGO150/WHY2"

[workspace.dependencies]
why2 = { path = "core", version = "1.4.11" }
sha2 = "0.10.9"
zeroize = { version = "1.8.2", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
