[package]
name = "why2"
version = "0.2.8-rex"
edition = "2024"
build = "build.rs"

description = "Lightweight, fast, secure, and easy to use encryption system."
license = "GPL-3.0-only"
readme = "README.md"
repository = "https://git.satan.red/ENGO150/WHY2"
keywords = ["encryption", "chat", "security", "rust"]
categories = ["command-line-utilities", "network-programming", "cryptography"]
authors = ["Václav Šmejkal <engo@satan.red>"]

include = ["src/**", "Cargo.toml", "README.md", "LICENSE"]

#[package.metadata.docs.rs]
#all-features = true

[features]
chat = ["base91", "bincode", "p521", "serde", "toml_edit", "reqwest", "colored"]
client = ["chat", "crossterm"]
server = ["chat", "ctrlc"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "why2"
path = "src/chat/bin/client.rs"
required-features = ["client"]

[[bin]]
name = "why2-server"
path = "src/chat/bin/server.rs"
required-features = ["server"]

[dependencies]
base91 = { version = "0.1.0", optional = true }
bincode = { version = "2.0.1", features = ["serde"], optional = true }
colored = { version = "3.0.0", optional = true }
crossterm = { version = "0.29.0", optional = true }
ctrlc = { version = "3.5.0", optional = true }
dirs = "6.0.0"
p521 = { version = "0.13.3", features = ["ecdh", "pkcs8"], optional = true }
rand = "0.9.2"
rand_chacha = "0.9.0"
reqwest = { version = "0.12.23", features = ["blocking"], optional = true }
semver = "1.0.27"
serde = { version = "1.0.219", optional = true }
serde_json = "1.0.143"
sha2 = "0.10.9"
toml_edit = { version = "0.23.6", optional = true }
