[package]
name = "why2"
version = "0.1.0"
edition = "2024"

description = "Lightweight, fast, secure, and easy to use encryption system."
license = "GPLv3"
readme = "README"
repository = "https://github.com/ENGO150/WHY2"
keywords = ["encryption", "chat", "security", "rust"]
categories = ["command-line-utilities", "network-programming", "cryptography"]
authors = ["Václav Šmejkal <engo@satan.red>"]

include = ["src/**", "Cargo.toml", "README", "LICENSE"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "chat_client"
path = "src/chat/bin/client.rs"

[[bin]]
name = "chat_server"
path = "src/chat/bin/server.rs"

[dependencies]
base91 = "0.1.0"
bincode = { version = "2.0.1", features = ["serde"] }
crossterm = "0.29.0"
ctrlc = "3.5.0"
dirs = "6.0.0"
once_cell = "1.21.3"
openssl = "0.10.73"
rand = "0.9.2"
reqwest = { version = "0.12.23", features = ["blocking"] }
serde = "1.0.219"
serde_json = "1.0.143"
sha2 = "0.10.9"
toml = "0.9.5"
