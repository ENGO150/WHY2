stages:
  - test
  - build

test-why2-core:
  stage: test
  image: rust:latest
  only:
    - development
  script:
    - echo "Test WHY2 Core"
    - cargo test --all --verbose

build-why2-chat:
  stage: build
  image: rust:latest
  only:
    - development
  needs:
    - job: test-why2-core
  script:
    - echo "Build WHY2 Chat"
    - cargo build --features client --release
    - cargo build --features server --release
  artifacts:
    name: "why2-chat-artifacts"
    paths:
      - ./target/release/why2
      - ./target/release/why2-server
