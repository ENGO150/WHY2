image: rust:latest

stages:
  - test
  - build
  - aur

# Test WHY2 Encrypt/Decrypt
test-why2-encryption:
  stage: test
  image: rust:latest
  only:
    - development
  script:
    - cargo test -p why2 encrypt_decrypt --verbose --release -- --nocapture

# Test WHY2 Multi Grid Overflow
test-why2-grid-overflow:
  stage: test
  image: rust:latest
  only:
    - development
  script:
    - cargo test -p why2 verify_multi_grid_overflow --verbose --release -- --nocapture

# Test WHY2 Diffusion
test-why2-diffusion:
  stage: test
  image: rust:latest
  only:
    - development
  script:
    - cargo test -p why2 test_input_diffusion --verbose --release -- --nocapture
    - cargo test -p why2 test_key_diffusion --verbose --release -- --nocapture

# Test WHY2 Legacy
test-why2-legacy:
  stage: test
  image: rust:latest
  only:
    - development
  script:
    - cargo test -p why2 legacy_encrypt_decrypt --features legacy --verbose --release -- --nocapture

# Build chat for linux
build-why2-chat-linux:
  stage: build
  only:
    - development
  script:
    - apt-get update && apt-get install -y pkg-config libasound2-dev libopus-dev
    - cargo build --release
    - cargo build --bin why2-server --no-default-features --features server --release
  artifacts:
    name: "why2-chat-linux"
    paths:
      - ./target/release/why2
      - ./target/release/why2-server

# Upload to Arch Linux User Repository
upload-to-aur:
  stage: aur
  rules:
    - if: '$CI_COMMIT_BRANCH == "release" && $CI_SERVER_URL == "https://git.satan.red"'
      when: always
    - when: never
  script:
    # Install dependencies
    - apt update && apt install -y git grep sed

    # Setup SSH
    - mkdir -p ~/.ssh
    - echo "$AUR_SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - echo -e "aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN" >> ~/.ssh/known_hosts
    - echo -e "Host aur.archlinux.org\n\tUser aur\n\tIdentityFile ~/.ssh/id_ed25519" > ~/.ssh/config

    # Setup Git
    - git config --global user.name "Expandera"
    - git config --global user.email "gitlab@satan.red"

    # Extract version
    - VERSION=$(grep '^version =' Cargo.toml | head -n1 | sed -E 's/version\s*=\s*"(.*)"/\1/')

    # Clone & modify AUR repository
    - git clone ssh://aur@aur.archlinux.org/why2.git
    - cd why2

    # Update PKGBUILD
    - sed -i "s/^pkgver=.*/pkgver=$VERSION/" PKGBUILD
    - sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD

    # Update .SRCINFO
    - sed -i "s/^\s*pkgver = .*/\tpkgver = $VERSION/" .SRCINFO
    - sed -i "s/^\s*pkgrel = .*/\tpkgrel = 1/" .SRCINFO

    # Commit & push
    - git add PKGBUILD .SRCINFO
    - git commit -m "update version to $VERSION" -m "(automated upload)"
    - git push
