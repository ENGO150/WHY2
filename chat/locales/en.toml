# To translate: copy this file to <config dir>/locales/<language>.toml (the config dir is
# ~/.config/WHY2 unless the build says otherwise), translate the values and set
# `language = "<language>"` in client.toml.
#
# - {name} is filled in by the client; keep the placeholders, move them where the language
#   wants them. Write {{ or }} for a literal brace in a text that has placeholders.
# - A table of one/few/many/other is a plural; [meta] plurals picks the rule:
#   "one-other" (English, German, ...), "one-few-other" (Czech, Slovak),
#   "one-few-many" (Russian, Ukrainian, ...) or "other" (no plural forms).
# - Command names, color names, role names and the server's own settings are what people
#   type or what the server sends, so they are not in here.
# - time.* are chrono format strings.

