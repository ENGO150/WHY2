[package]
name = "why2"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true

default-run = "why2"
build = "build.rs"

[features]
default = ["client"]

chat = ["dep:base91", "dep:bincode", "dep:serde", "dep:reqwest", "dep:colored", "dep:toml_edit", "dep:dirs", "dep:semver", "dep:p521", "dep:hmac", "dep:hkdf"]
client = ["chat", "dep:crossterm"]
server = ["chat", "dep:ctrlc", "dep:argon2", "dep:dashmap"]

[dependencies]
why2-core = { path = "../core", version = "0.2.9-rex" }

argon2 = { version = "0.5.3", optional = true }
base91 = { version = "0.1.0", optional = true }
bincode = { version = "2.0.1", features = ["serde"], optional = true }
colored = { version = "3.0.0", optional = true }
crossterm = { version = "0.29.0", optional = true }
ctrlc = { version = "3.5.1", optional = true }
dirs = { version = "6.0.0", optional = true }
p521 = { version = "0.13.3", features = ["ecdh", "pkcs8"], optional = true }
reqwest = { version = "0.12.25", features = ["blocking"], optional = true }
semver = { version = "1.0.27", optional = true }
toml_edit = { version = "0.23.9", optional = true }
dashmap = { version = "6.1.0", optional = true }
hmac = { version = "0.12.1", optional = true }
hkdf = { version = "0.12.4", optional = true }

serde = { workspace = true, optional = true }
serde_json = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
sha2 = { workspace = true }

[[bin]]
name = "why2"
path = "src/bin/client.rs"
required-features = ["client"]

[[bin]]
name = "why2-server"
path = "src/bin/server.rs"
required-features = ["server"]
