[package]
name = "why2-chat"
version = "2.0.1"
authors.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Lightweight, fast and secure chat application powered by WHY2 encryption."
keywords = ["encryption", "security", "cryptography", "network", "chat"]
categories = ["cryptography", "network-programming"]
readme = "./README.md"

default-run = "why2"

[lib]
doc = false

[[bin]]
name = "why2"
path = "src/bin/client/mod.rs"
required-features = ["client_base"]
doc = false

[[bin]]
name = "why2-server"
path = "src/bin/server.rs"
required-features = ["server"]
doc = false

[dependencies]
# GLOBAL
why2 = { workspace = true }
sha2 = { workspace = true }
zeroize = { workspace = true }
tokio = { version = "1.53.1", features = ["full"], optional = true }
hmac = { version = "0.13.0", optional = true }
serde_json = { version = "1.0.151", optional = true }
wincode = { version = "0.6.1", features = ["derive"], optional = true }
dirs = { version = "6.0.0", optional = true }
p521 = { version = "0.14.0", features = ["ecdh", "ecdsa", "pkcs8", "getrandom"], optional = true }
ml-kem = { version = "0.3.2", features = ["getrandom"], optional = true }
ureq = { version = "3.4.0", optional = true }
semver = { version = "1.0.28", optional = true }
toml_edit = { version = "0.25.13", optional = true }
hkdf = { version = "0.13.0", optional = true }
tokio-socks = { version = "0.5.3", optional = true }
dashmap = { version = "6.2.1", optional = true }
rand = { version = "0.10.2", optional = true }
socket2 = { version = "0.6.5", optional = true }

# CHAT (CLIENT SPECIFIC)
crossterm = { version = "0.29.0", optional = true, features = ["event-stream"] }
tokio-stream = { version = "0.1.19", optional = true }
ratatui = { version = "0.30.2", optional = true, default-features = false, features = ["crossterm_0_29", "std", "layout-cache", "underline-color", "all-widgets"] }
unicode-width = { version = "0.2.2", optional = true }

# VOICE CHAT (CLIENT)
cpal = { version = "0.18.2", optional = true, features = ["pulseaudio"] }
ringbuf = { version = "0.5.1", optional = true }
audiopus = { version = "0.2.0", optional = true }
gag = { version = "1.0.0", optional = true }
nnnoiseless = { version = "0.5.2", default-features = false, optional = true }
lewton = { version = "0.10.2", optional = true }

# SCREEN SHARE (CLIENT SPECIFIC)
winit = { version = "0.30.13", optional = true }
xcap = { version = "0.9.8", default-features = false, optional = true }
wgpu = { version = "30.0.1", optional = true }
pollster = { version = "1.0.1", optional = true }
openh264 = { version = "0.9.8", optional = true }

# CHAT (SERVER SPECIFIC)
argon2 = { version = "0.6.0", optional = true }
log = { version = "0.4.34", optional = true }
simple_logger = { version = "5.2.0", optional = true }

[features]
default = ["client", "windows_resources"]

# EMBEDS THE WINDOWS ICON/VERSION INFO/MANIFEST; BINARY BUILDS ONLY (SEE build.rs)
windows_resources = []

chat = [
    "dep:tokio",
    "dep:hmac",
    "dep:serde_json",
    "dep:wincode",
    "dep:ureq",
    "dep:toml_edit",
    "dep:dirs",
    "dep:semver",
    "dep:p521",
    "dep:ml-kem",
    "dep:hkdf",
    "dep:dashmap",
    "dep:rand",
    "dep:socket2",
]

client_base = [
    "chat",
    "dep:tokio-socks",
    "dep:crossterm",
    "dep:tokio-stream",
    "dep:ratatui",
    "dep:unicode-width",
]

client_voice = [
    "dep:cpal",
    "dep:ringbuf",
    "dep:audiopus",
    "dep:gag",
    "dep:nnnoiseless",
    "dep:lewton",
]

client_screen = [
    "client_voice",
    "dep:winit",
    "dep:libwayshot",
    "dep:xcap",
    "dep:wgpu",
    "dep:pollster",
    "dep:openh264",
]

client = [
    "client_base",
    "client_voice",
    "client_screen",
]

server = [
    "chat",
    "dep:argon2",
    "dep:log",
    "dep:simple_logger",
]

[build-dependencies]
winresource = "0.1.31"

[target.'cfg(target_os = "linux")'.dependencies]
libwayshot = { version = "0.9.0", default-features = false, optional = true }
